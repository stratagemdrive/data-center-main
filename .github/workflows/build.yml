name: Update Global News Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:      # Allows manual triggers from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests python-dateutil

      - name: Run Scraper Script
        run: python scripts/build_data_json.py

      - name: Strip global_events from JSON
        run: |
          if [ -f docs/data.json ]; then
            jq 'del(.global_events)' docs/data.json > docs/data.tmp.json && mv docs/data.tmp.json docs/data.json
          fi

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update news data (exclude global events)"
          file_pattern: "docs/data.json"
