name: Update Global News Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:      # Allows manual triggers from GitHub Actions UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests python-dateutil

      - name: Run Scraper Script
        run: |
          # Finds and runs the Python script dynamically if named script.py, main.py, or scrape.py
          SCRIPT_PATH=$(find . -maxdepth 2 -type f \( -name "script.py" -o -name "main.py" -o -name "scrape.py" \) | head -n 1)
          if [ -n "$SCRIPT_PATH" ]; then
            echo "Running $SCRIPT_PATH..."
            python "$SCRIPT_PATH"
          else
            echo "Error: Could not locate Python script in repository."
            exit 1
          fi

      - name: Strip global_events from JSON
        run: |
          if [ -f public/data.json ]; then
            jq 'del(.global_events)' public/data.json > public/data.tmp.json && mv public/data.tmp.json public/data.json
          fi

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update news data (exclude global events)"
          file_pattern: "public/data.json"
